# Builds the iPhone app (mobile/) on GitHub's Mac computers, so no Mac is
# needed.
#
# - On a pull request that changes the app or the site: checks it builds
#   (unsigned).
# - Run it by hand (Actions → iPhone app → Run workflow) to build a signed
#   copy and upload it to App Store Connect, where it appears in TestFlight
#   after about 15 minutes.
#
# Uploading uses four repository secrets (Settings → Secrets and variables
# → Actions), all from App Store Connect: APPSTORE_KEY_ID,
# APPSTORE_ISSUER_ID, APPSTORE_KEY (the text of the .p8 key file) and
# APPLE_TEAM_ID. Xcode creates the signing certificate and profile itself
# with that key. See mobile/README.md.
name: iPhone app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - 'app.js'
      - 'styles.css'
      - 'index.html'
      - 'config.js'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Copy the site into the app
        run: node copy-web.js && npx cap sync ios

      - name: Check it builds (unsigned)
        if: github.event_name == 'pull_request'
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test "${PIPESTATUS[0]}" = 0

      - name: Build, sign and upload to App Store Connect
        if: github.event_name == 'workflow_dispatch'
        working-directory: mobile/ios/App
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY: ${{ secrets.APPSTORE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Pasted secrets often carry a stray newline or space.
          KEY_ID=$(printf '%s' "$KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$ISSUER_ID" | tr -d '[:space:]')
          TEAM_ID=$(printf '%s' "$TEAM_ID" | tr -d '[:space:]')
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY" ] || [ -z "$TEAM_ID" ]; then
            echo "::error::Add the four App Store Connect secrets first (see mobile/README.md)."
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${AUTH[@]}" archive | tail -n 40
          test "${PIPESTATUS[0]}" = 0
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"
          rm -f "$KEY_PATH"
          echo "Uploaded build ${{ github.run_number }}. It appears in App Store Connect → TestFlight in about 15 minutes."
